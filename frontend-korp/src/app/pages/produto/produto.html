<div class="container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Cadastro de Produto</mat-card-title>
    </mat-card-header>
    
    <mat-card-content>
      <form [formGroup]="produtoForm" (ngSubmit)="salvarProduto()" class="form-produto">
        
        <mat-form-field appearance="outline">
          <mat-label>Código do Produto</mat-label>
          <input matInput formControlName="codigo" placeholder="Ex: PRD-001">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Descrição</mat-label>
          <input matInput formControlName="descricao" placeholder="Ex: Placa de Vídeo">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Saldo Inicial</mat-label>
          <input matInput type="number" formControlName="saldo">
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" [disabled]="produtoForm.invalid">
          Salvar Produto
        </button>
      </form>
    </mat-card-content>
  </mat-card>

  <mat-card class="mt-20">
    <mat-card-header>
      <mat-card-title>Estoque Atual</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      
      <table mat-table [dataSource]="produtos" class="mat-elevation-z8">
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef> ID </th>
          <td mat-cell *matCellDef="let element"> {{element.id}} </td>
        </ng-container>

        <ng-container matColumnDef="codigo">
          <th mat-header-cell *matHeaderCellDef> Código </th>
          <td mat-cell *matCellDef="let element"> {{element.codigo}} </td>
        </ng-container>

        <ng-container matColumnDef="descricao">
          <th mat-header-cell *matHeaderCellDef> Descrição </th>
          <td mat-cell *matCellDef="let element"> {{element.descricao}} </td>
        </ng-container>

        <ng-container matColumnDef="saldo">
          <th mat-header-cell *matHeaderCellDef> Saldo </th>
          <td mat-cell *matCellDef="let element"> {{element.saldo}} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="colunasTabela"></tr>
        <tr mat-row *matRowDef="let row; columns: colunasTabela;"></tr>
      </table>

    </mat-card-content>
  </mat-card>
</div>
